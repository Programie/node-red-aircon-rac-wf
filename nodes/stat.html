<script type="text/javascript">
    const defaults = {
        host: {
            value: "",
            required: true
        },
        protocol: {
            value: "auto",
            required: true
        },
        // Kept so that nodes configured before the protocol became a choice
        // can be migrated in oneditprepare below.
        useHttps: {
            value: false,
            required: false
        },
        operatorId: {
            value: "",
            required: false
        },
        deviceId: {
            value: "",
            required: false
        },
        name: {
            value: "",
            required: false
        }
    };

    // A node saved before the protocol became a choice has no protocol set. An
    // explicitly ticked "Use HTTPS" was a deliberate choice and is carried
    // over; its unticked default was not, so detection takes over there.
    function migrateProtocol() {
        if (!this.protocol) {
            $("#node-input-protocol").val(this.useHttps ? "https" : "auto");
        }
    }

    RED.nodes.registerType("mitsubishi-aircon-getstat", {
        category: "mitsubishi-aircon",
        paletteLabel: "getstat",
        color: "#ff9b9b",
        icon: "font-awesome/fa-sign-out",
        defaults: defaults,
        inputs: 1,
        outputs: 1,
        label: function () {
            return this.name || this.host || "getstat";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: migrateProtocol
    });

    RED.nodes.registerType("mitsubishi-aircon-setstat", {
        category: "mitsubishi-aircon",
        paletteLabel: "setstat",
        color: "#ff9b9b",
        icon: "font-awesome/fa-sign-in",
        defaults: defaults,
        inputs: 1,
        outputs: 1,
        label: function () {
            return this.name || this.host || "setstat";
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: migrateProtocol
    });
</script>

<script type="text/html" data-template-name="mitsubishi-aircon-getstat">
    <div class="form-row">
        <label for="node-input-host"><i class="fa fa-globe"></i> Host</label>
        <input type="text" id="node-input-host" placeholder="Host">
    </div>

    <div class="form-row">
        <label for="node-input-protocol">Protocol</label>
        <select id="node-input-protocol">
            <option value="auto">Detect automatically</option>
            <option value="http">HTTP</option>
            <option value="https">HTTPS</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-operatorId">Operator ID</label>
        <input type="text" id="node-input-operatorId" placeholder="Optional Operator ID">
    </div>

    <div class="form-row">
        <label for="node-input-deviceId">Device ID</label>
        <input type="text" id="node-input-deviceId" placeholder="Optional Device ID">
    </div>

    <div class="form-row">
        <label for="node-input-name">Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="mitsubishi-aircon-getstat">
    <p>Retrieve state from a Mitsubishi Aircon.</p>
    <p>Modules ship with one of two firmware branches, one speaking plain HTTP on port 51443 and the other TLS. <b>Detect automatically</b> tries both on the first request and remembers what worked.</p>
</script>

<script type="text/html" data-template-name="mitsubishi-aircon-setstat">
    <div class="form-row">
        <label for="node-input-host"><i class="fa fa-globe"></i> Host</label>
        <input type="text" id="node-input-host" placeholder="Host">
    </div>

    <div class="form-row">
        <label for="node-input-protocol">Protocol</label>
        <select id="node-input-protocol">
            <option value="auto">Detect automatically</option>
            <option value="http">HTTP</option>
            <option value="https">HTTPS</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-operatorId">Operator ID</label>
        <input type="text" id="node-input-operatorId" placeholder="Optional Operator ID">
    </div>

    <div class="form-row">
        <label for="node-input-deviceId">Device ID</label>
        <input type="text" id="node-input-deviceId" placeholder="Optional Device ID">
    </div>

    <div class="form-row">
        <label for="node-input-name">Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="mitsubishi-aircon-setstat">
    <p>Change state of a Mitsubishi Aircon.</p>
    <p>Modules ship with one of two firmware branches, one speaking plain HTTP on port 51443 and the other TLS. <b>Detect automatically</b> tries both on the first request and remembers what worked.</p>
